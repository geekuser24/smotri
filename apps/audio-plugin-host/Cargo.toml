[package]
name = "filmcraft-audio-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
filmcraft-audio-plugin-client = { workspace = true }
filmcraft-project = { workspace = true }
serde_json = { workspace = true }
vst3 = "0.3"
vst = { version = "0.4", features = ["disable_deprecation_warning"] }
libloading = "0.9"
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-audio-toolbox = "0.3.2"
objc2-core-audio-types = "0.3.2"
