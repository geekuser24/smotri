name: Smotri platform builds
on:
  workflow_dispatch:
  push:
    tags: ['smotri-v*']
permissions:
  contents: read
concurrency:
  group: smotri-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-ARM64, os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS-Intel, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: Windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Windows-ARM64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { name: Linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: Linux-ARM64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: preview-${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libasound2-dev libudev-dev
      - name: Build native editor and CLI
        run: cargo build --release --locked -p filmcraft -p filmcraft-cli --target ${{ matrix.target }}
      - name: Native CLI smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/filmcraft-cli --help
      - name: Package preview with version and checksums
        run: python packaging/preview.py --target ${{ matrix.target }} --platform ${{ matrix.name }} --version 0.12.0-preview.20261025 --sha ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: Smotri-${{ matrix.name }}-preview
          path: dist/preview/
          if-no-files-found: error
          retention-days: 14
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: preview-wasm
      - run: cargo build --release --locked -p filmcraft-web --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v4
        with:
          name: Smotri-WebAssembly-validation
          path: target/wasm32-unknown-unknown/release/filmcraft_web.wasm
  publish:
    name: Publish preview downloads
    needs: [native, web]
    if: startsWith(github.ref, 'refs/tags/smotri-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/downloads
          merge-multiple: true
      - name: Publish only after all platform jobs succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/downloads/* --verify-tag --prerelease --title "Smotri 0.12.0 · Preview 2026-10-25" --notes-file CHANGELOG-SMOTRI.md
