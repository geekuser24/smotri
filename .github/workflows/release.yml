name: Smotri platform builds
on:
  workflow_dispatch:
  push:
    tags: ['smotri-v*']
permissions:
  contents: read
concurrency:
  group: smotri-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-ARM64, os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS-Intel, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: Windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: Windows-ARM64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { name: Linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: Linux-ARM64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libasound2-dev libudev-dev
      - name: Build native editor and CLI
        run: cargo build --release --locked -p filmcraft -p filmcraft-cli --target ${{ matrix.target }}
      - name: Native CLI smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/filmcraft-cli --help
      - name: Stage validation artifacts
        shell: python
        run: |
          import pathlib, shutil, hashlib, json, os
          out=pathlib.Path('dist/validation');out.mkdir(parents=True,exist_ok=True)
          suffix='.exe' if os.name=='nt' else ''
          for name in ('filmcraft','filmcraft-cli'):
              src=pathlib.Path('target/${{ matrix.target }}/release')/(name+suffix)
              shutil.copy2(src,out/(name.replace('filmcraft','Smotri')+suffix))
          for name in ('LICENSE-MIT','LICENSE-APACHE','NOTICE'):
              shutil.copy2(name,out/name)
          (out/'README.txt').write_text('Smotri native validation build. Not a complete public installer: bundled Downloader tools and platform launch/import/export validation are required before release. API keys are not included.\n')
          (out/'SHA256SUMS.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()},indent=2))
      - uses: actions/upload-artifact@v7
        with:
          name: Smotri-${{ matrix.name }}-validation
          path: dist/validation/
          if-no-files-found: error
          retention-days: 14
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --locked -p filmcraft-web --target wasm32-unknown-unknown
      - uses: actions/upload-artifact@v7
        with:
          name: Smotri-WebAssembly-validation
          path: target/wasm32-unknown-unknown/release/filmcraft_web.wasm
