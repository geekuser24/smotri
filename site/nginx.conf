limit_req_zone $binary_remote_addr zone=smotri_api:10m rate=5r/s;
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/smotri.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smotri.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name smotri.cc www.smotri.cc;
    client_max_body_size 8m;
    if ($host = www.smotri.cc) { return 301 https://smotri.cc$request_uri; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        proxy_pass http://127.0.0.1:8317;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=smotri_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8317;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
